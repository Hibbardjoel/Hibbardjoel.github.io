<style>
  :root{
    --paper:#F5F7F4; --panel:#FFFFFF; --ink:#1C2430; --muted:#5B6672; --rule:#D8DED9;
    --enterprise:#2F6F6A;   /* surgical teal: operations, scale */
    --modern:#4353A3;       /* signal indigo: product, modern stack */
    --brass:#9A7535;
    --serif:"Source Serif 4", Georgia, serif;
    --sans:"Instrument Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --paper:#12171E; --panel:#19202A; --ink:#E6EAE7; --muted:#9AA5B0; --rule:#2A333E;
           --enterprise:#6FB8B0; --modern:#8E9CE6; --brass:#CFA968; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16.5px/1.6 var(--sans)}
  a{color:inherit;text-decoration-color:var(--muted);text-underline-offset:3px}
  a:hover{text-decoration-color:currentColor}
  a:focus-visible,button:focus-visible{outline:2px solid var(--enterprise);outline-offset:3px;border-radius:2px}
  .wrap{max-width:64rem;margin:0 auto;padding:4rem 1.5rem 3rem}

  /* ---------- opening screen ---------- */
  .top{display:flex;justify-content:space-between;gap:2rem;align-items:baseline;flex-wrap:wrap}
  h1{font:600 clamp(2.5rem,5.6vw,4rem)/1.02 var(--serif);letter-spacing:-.02em;margin:0}
  .contact{display:flex;gap:1.25rem;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
  .contact button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted)}
  .headline{font:400 clamp(1.2rem,2.3vw,1.55rem)/1.35 var(--serif);max-width:30ch;margin:1.1rem 0 0}
  .lede{max-width:62ch;color:var(--muted);margin:1rem 0 0;font-size:1rem}
  .variant{display:inline-block;margin-top:1rem;font-size:.82rem;color:var(--modern);border:1px solid currentColor;border-radius:999px;padding:.1rem .7rem}

  /* the memorable piece: two pillars, one thread */
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-top:2.5rem}
  .pillar{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--c);border-radius:6px;padding:1.4rem 1.5rem 1.3rem;display:flex;flex-direction:column}
  .pillar[data-accent="enterprise"]{--c:var(--enterprise)}
  .pillar[data-accent="modern"]{--c:var(--modern)}
  .pillar h2{font:600 1.35rem/1.2 var(--serif);margin:0;color:var(--ink)}
  .pillar .org{font-size:.88rem;color:var(--c);font-weight:600;margin:.3rem 0 .8rem}
  .pillar .org span{color:var(--muted);font-weight:400}
  .pillar p{margin:0 0 1rem;font-size:.97rem}
  .tags{display:flex;flex-wrap:wrap;gap:.35rem .4rem;margin-top:auto;padding:0;list-style:none}
  .tags li{font-size:.78rem;line-height:1;padding:.38rem .55rem;border-radius:4px;background:color-mix(in srgb,var(--c,var(--muted)) 10%,transparent);color:var(--c,var(--muted))}
  .thread{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:start;margin-top:1.25rem;padding:1.1rem 1.5rem;border-radius:6px;
          background:linear-gradient(90deg,color-mix(in srgb,var(--enterprise) 8%,transparent),color-mix(in srgb,var(--modern) 8%,transparent))}
  .thread h3{font:600 .95rem/1.4 var(--serif);margin:0;white-space:nowrap}
  .thread p{margin:0;font-size:.95rem}

  section{padding:2.75rem 0;border-top:1px solid var(--rule)}
  .opening{padding-top:0;border-top:0;padding-bottom:3rem}
  h2.h{font:600 1.45rem/1.2 var(--serif);margin:0 0 1.5rem}

  /* skill bridges */
  .bridge{display:grid;grid-template-columns:11rem 1fr 13rem;align-items:center;gap:1.25rem;padding:1rem 0;border-top:1px solid var(--rule)}
  .bridge:first-of-type{border-top:0}
  .bridge .soft{font:600 1.02rem/1.25 var(--serif);text-align:right}
  .bridge .hard{font:600 .93rem/1.3 var(--sans);color:var(--enterprise)}
  .span{font-size:.9rem;color:var(--muted)}
  .span::before{content:"";display:block;height:2px;background:linear-gradient(90deg,var(--enterprise),var(--modern));margin-bottom:.5rem;border-radius:2px}
  .bridge-key{display:grid;grid-template-columns:11rem 1fr 13rem;gap:1.25rem;font-size:.82rem;color:var(--muted);margin-bottom:.3rem}
  .bridge-key span:first-child{text-align:right}

  /* experience */
  .job{display:grid;grid-template-columns:9rem 1fr;gap:1.75rem;padding:1.5rem 0}
  .job+.job{border-top:1px solid var(--rule)}
  .dates{font-size:.86rem;color:var(--muted);padding-top:.25rem;font-variant-numeric:tabular-nums}
  .job h3{font:600 1.18rem/1.3 var(--serif);margin:0}
  .job .prev{font-size:.82rem;color:var(--muted);margin:.1rem 0 0}
  .job .co{font-weight:600;color:var(--c,var(--ink));margin:.15rem 0 .5rem;font-size:.95rem}
  .job[data-accent="enterprise"]{--c:var(--enterprise)}
  .job[data-accent="modern"]{--c:var(--modern)}
  .job .ctx{font-size:.92rem;color:var(--muted);margin:0 0 .6rem;max-width:68ch}
  .job ul.b{margin:0;padding-left:1.1rem;max-width:72ch}
  .job ul.b li{margin:.35rem 0}
  .job .tags{margin-top:.8rem}
  .early{margin:1.25rem 0 0 10.75rem;font-size:.92rem;color:var(--muted);max-width:68ch}
  .early p{margin:.3rem 0}

  .comp{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
  .comp h3{font:600 1rem var(--serif);margin:0 0 .6rem}
  .comp ul{margin:0;padding:0;list-style:none;font-size:.92rem}
  .comp li{padding:.3rem 0;border-bottom:1px dotted var(--rule)}
  dl.stack{display:grid;grid-template-columns:9rem 1fr;gap:.6rem 1.75rem;margin:0}
  dl.stack dt{font-weight:600;font-size:.92rem}
  dl.stack dd{margin:0;font-size:.92rem;color:var(--muted)}
  footer{padding:2rem 0 0;border-top:1px solid var(--rule);font-size:.85rem;color:var(--muted);display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
  footer strong{display:block;color:var(--ink);font-weight:600;margin-bottom:.15rem}
  .veteran{color:var(--brass);font-weight:600}
  .stackline{display:none;font-size:8.5pt;color:var(--muted);margin:.3rem 0 0;padding-top:.4rem;border-top:1px solid var(--rule)}
  .stackline strong{color:var(--ink)}
  .print-only{display:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}


  /* career arc: 30+ years in one glance */
  .arc{margin:0 0 1.75rem}
  .arc-bar{display:flex;height:2.1rem;border-radius:5px;overflow:hidden;gap:2px}
  .seg{display:flex;align-items:center;padding:0 .6rem;font-size:.8rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
  .seg.s0{background:color-mix(in srgb,var(--muted) 70%,var(--paper))}
  .seg.s1{background:color-mix(in srgb,var(--brass) 80%,var(--paper))}
  .seg.s2{background:var(--enterprise)}
  .seg.s3{background:var(--modern);padding:0}
  .arc-notes{display:flex;gap:2px;margin-top:.45rem}
  .note{font-size:.78rem;line-height:1.35;color:var(--muted);padding-right:.6rem;min-width:0}
  .note strong{display:block;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .co a,.org a{color:inherit;text-decoration-color:currentColor}
  @media (max-width:760px){
    .arc-notes{flex-direction:column;gap:.35rem}
    .note{flex:none!important}
    .seg span{font-size:.7rem}
    .seg.s0 span,.seg.s1 span{overflow:hidden;text-overflow:ellipsis}
  }
  @media (max-width:760px){
    .wrap{padding-top:2.25rem}
    .pillars{grid-template-columns:1fr}
    .thread{grid-template-columns:1fr;gap:.3rem}
    .comp,footer{grid-template-columns:1fr}
    .bridge,.bridge-key{grid-template-columns:1fr;gap:.35rem}
    .bridge .soft{text-align:left}
    .bridge-key{display:none}
    .job{grid-template-columns:1fr;gap:.25rem}
    .early{margin-left:0}
    dl.stack{grid-template-columns:1fr;gap:.15rem}
    dl.stack dd{margin-bottom:.6rem}
  }
  @media (prefers-reduced-motion:no-preference){
    .pillar{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
    .pillar+.pillar{animation-delay:.12s}
    .thread{animation:rise .6s .24s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
  @media print{
    :root{--paper:#fff;--panel:#fff;--ink:#1C2430;--muted:#555;--rule:#ccc;--enterprise:#2F6F6A;--modern:#4353A3}
    @page{margin:.4in .45in}
    body{background:#fff;font-size:9pt;line-height:1.35}
    .wrap{padding:0;max-width:none;zoom:.9}
    .contact button,.variant,.web-only{display:none}
    .print-only{display:inline}
    .pillars{margin-top:1rem;gap:.8rem}
    .pillar{padding:.7rem .9rem;animation:none}
    .pillar p{font-size:9pt;margin-bottom:.5rem}
    .thread{display:none}
    .opening{padding-bottom:.6rem}
    section{padding:.55rem 0}
    section[aria-labelledby="s-br"],section[aria-labelledby="s-comp"],.early,.job .ctx,.job .tags{display:none}
    h2.h{font-size:13pt;margin-bottom:.4rem}
    .job{grid-template-columns:6.5rem 1fr;gap:1rem;padding:.4rem 0}
    .job ul.b li{margin:.12rem 0}
    .job ul.b,.lede{max-width:none}
    .job ul.b li:nth-child(n+5){display:none}
    .job ul.b li,.job h3,.job .co{break-inside:avoid}
    h2,.job h3,.job .co{break-after:avoid}
    dl.stack{grid-template-columns:6.5rem 1fr;gap:.15rem 1rem}
    dl.stack dt,dl.stack dd{font-size:9pt}
    footer{padding-top:.6rem}
    a{text-decoration:none}
    /* 1-page executive brief */
    body[data-print="brief"] .wrap{zoom:.78}
    body[data-print="brief"] .job[data-brief="0"]{display:none}
    body[data-print="brief"] .job ul.b li.nb{display:none}
    body[data-print="brief"] .pillar p{margin-bottom:.3rem}
    body[data-print="brief"] .pillar .tags{display:none}
    body[data-print="brief"] section[aria-labelledby="s-stack"]{display:none}
    body[data-print="brief"] .stackline{display:block}
    body[data-print="brief"] footer{display:block;padding-top:.3rem;line-height:1.5}
    body[data-print="brief"] footer div{display:inline;margin-right:1.1rem}
    body[data-print="brief"] footer strong{display:inline;margin-right:.35rem}
    body[data-print="brief"] footer br{content:"";display:inline}
    body[data-print="brief"] footer br::after{content:" · "}
    body[data-print="brief"] .job{padding:.3rem 0}
    .arc{margin-bottom:.6rem}
    .arc-bar{height:1.3rem;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .seg{font-size:7.5pt}
    .note{font-size:7.5pt}
  }
</style>

<script>
(function(){
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = ym => { if(!ym || ym==="Present") return ym||""; const [y,m]=ym.split("-"); return new Date(+y,(+m||1)-1).toLocaleString("en-US",{month:"short",year:"numeric"}); };
  const tags = (arr, accent) => arr && arr.length ? `<ul class="tags"${accent?` style="--c:var(--${accent})"`:""}>${arr.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>` : "";
  const accentFor = { bcd:"enterprise", npsyt:"modern" };

  // Variant selection: ?v=slug (GitHub Pages) or #v-slug (hash-only hosts)
  const q = new URLSearchParams(location.search).get("v");
  const h = (location.hash.match(/^#v-([a-z0-9-]+)$/)||[])[1];
  const slug = (q || h || "").replace(/[^a-z0-9-]/g,"");
  const url = slug ? `tailored/${slug}.json` : "data/master.json";

  function inline(){ try{ return JSON.parse(document.getElementById("inline-data").textContent); }catch(e){ return null; } }
  async function load(){
    try{ const r = await fetch(url,{cache:"no-store"}); if(r.ok) return r.json(); }catch(e){}
    return inline();
  }

  function render(d){
    const p = d.person, v = d.variant || {};
    const vps = d.value_props || [];
    const pillars = vps.filter(x => x.org);
    const thread = vps.find(x => !x.org);

    const pillarHTML = pillars.map(x => `
      <article class="pillar" data-accent="${esc(x.accent||"enterprise")}">
        <h2>${esc(x.title)}</h2>
        <p class="org">${x.url ? `<a href="${esc(x.url)}">${esc(x.org)}</a>` : esc(x.org)} <span>${esc(x.period||"")}</span></p>
        <p>${esc(x.text)}</p>
        ${tags(x.stack)}
      </article>`).join("");

    const jobs = d.experience.map(j => `
      <article class="job" data-accent="${accentFor[j.id]||""}" data-brief="${j.brief ?? 1}">
        <div class="dates">${esc(fmt(j.start))} – ${esc(fmt(j.end))}</div>
        <div>
          <h3>${esc(j.title)}</h3>${j.previous_title ? `<p class="prev">Previously ${esc(j.previous_title)}</p>`:""}
          <p class="co">${j.url ? `<a href="${esc(j.url)}">${esc(j.company)}</a>` : esc(j.company)}${j.location ? `<span style="color:var(--muted);font-weight:400">, ${esc(j.location)}</span>`:""}</p>
          ${j.context ? `<p class="ctx">${esc(j.context)}</p>`:""}
          <ul class="b">${j.bullets.map((b,i)=>`<li${i>=(j.brief ?? 1)?' class="nb"':""}>${esc(b.text)}</li>`).join("")}</ul>
          ${tags(j.stack, accentFor[j.id])}
        </div>
      </article>`).join("");

    const arcData = d.career_arc || [];
    const y0 = arcData.length ? arcData[0].start : 0, y1 = arcData.length ? arcData[arcData.length-1].end : 1;
    const arc = arcData.length ? `<figure class="arc" aria-label="Career arc, ${y0} to present">
        <div class="arc-bar">${arcData.map((a,i)=>`<div class="seg s${i}" style="flex:${a.end-a.start}" title="${esc(a.era)}: ${esc(a.text)}">${(a.end-a.start)>=3?`<span>${esc(a.era)}</span>`:""}</div>`).join("")}</div>
        <div class="arc-notes">${arcData.filter(a=>(a.end-a.start)>=3).map((a,i,arr)=>{
          const tail = i===arr.length-1 ? arcData.slice(arcData.indexOf(a)+1) : [];
          const w = (a.end-a.start) + tail.reduce((n,t)=>n+(t.end-t.start),0);
          const now = (tail.length ? tail[tail.length-1].end : a.end) >= new Date().getFullYear();
          const extra = tail.map(t=>`; ${esc(t.era.toLowerCase())}, ${esc(t.text)} (${t.start})`).join("");
          return `<div class="note s${i}" style="flex:${w}"><strong>${a.start}–${now?"now":a.end}</strong>${esc(a.text)}${extra}</div>`;}).join("")}</div>
      </figure>` : "";
    const early = (d.earlier_career||[]).map(e=>`<p>${esc(e.text)}</p>`).join("");
    const bridges = (d.skill_bridges||[]).map(b=>`
      <div class="bridge"><div class="soft">${esc(b.soft)}</div><div class="span">${esc(b.evidence)}</div><div class="hard">${esc(b.hard)}</div></div>`).join("");
    const comp = d.competencies||{};
    const compCol = (t,arr)=> arr&&arr.length ? `<div><h3>${t}</h3><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
    const stack = Object.entries(d.tech_stack||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v.map(esc).join(", ")}</dd>`).join("");
    const edu = (d.education||[]).map(e=>`${esc(e.degree)}, ${esc(e.school)}`).join("<br>");

    document.title = `${p.name} — ${v.target_role || "Resume"}`;
    document.getElementById("app").innerHTML = `
      <section class="opening" aria-label="Introduction">
        <div class="top">
          <h1>${esc(p.name)}</h1>
          <div class="contact">
            <span>${esc(p.location)}</span>
            ${p.phone ? `<span class="print-only">${esc(p.phone)}</span>`:""}
            <a href="mailto:${esc(p.email)}">${esc(p.email)}</a>
            <a class="web-only" href="${esc(p.linkedin)}">LinkedIn</a>
            <a class="web-only" href="${esc(p.github)}">GitHub</a>
            <button type="button" data-print="brief">1-page PDF</button>
            <button type="button" data-print="full">Full PDF</button>
          </div>
        </div>
        <p class="headline">${esc(p.headline)}</p>
        <p class="lede">${esc(d.summary)}</p>
        ${v.id && v.id!=="master" ? `<span class="variant">Tailored for ${esc(v.label)}</span>`:""}
        <div class="pillars">${pillarHTML}</div>
        ${thread ? `<div class="thread"><h3>${esc(thread.title)}</h3><p>${esc(thread.text)}</p></div>`:""}
      </section>

      <section aria-labelledby="s-exp">
        <h2 class="h" id="s-exp">Experience</h2>
        ${arc}
        ${jobs}
        ${early ? `<div class="early"><p><strong>Earlier career</strong></p>${early}</div>`:""}
      </section>

      ${bridges ? `<section aria-labelledby="s-br">
        <h2 class="h" id="s-br">Where the people skills meet the technical work</h2>
        <div class="bridge-key"><span>Leadership trait</span><span>Proof</span><span>Technical capability</span></div>
        ${bridges}
      </section>`:""}

      <section aria-labelledby="s-comp">
        <h2 class="h" id="s-comp">Capabilities</h2>
        <div class="comp">${compCol("Leadership", comp.leadership)}${compCol("Technical", comp.technical)}${compCol("Human-centered", comp.human)}</div>
      </section>

      <section aria-labelledby="s-stack">
        <h2 class="h" id="s-stack">Technology I work in</h2>
        <dl class="stack">${stack}</dl>
      </section>

      <p class="stackline"><strong>Technology:</strong> ${Object.values(d.tech_stack||{}).flat().filter(t=>!/AWS RDS|Schema|Vite|REST|Office 365|pg_cron|GitHub Pages|Runbooks|LMS|KPI|PL\/pgSQL/.test(t)).slice(0,18).map(esc).join(", ")}</p>
      <footer>
        <div><strong>Service</strong><span class="veteran">U.S. Navy veteran</span>, FMF Corpsman</div>
        <div><strong>Certifications and languages</strong>${(d.certifications||[]).map(esc).join("<br>")}<br>${(d.languages||[]).map(esc).join(", ")}</div>
        <div><strong>Education</strong>${edu}</div>
      </footer>`;
    document.querySelectorAll("[data-print]").forEach(btn => btn.addEventListener("click", () => {
      document.body.dataset.print = btn.dataset.print;
      try{ window.print(); }catch(e){}
    }));
    window.addEventListener("afterprint", () => { document.body.dataset.print = "full"; });
  }

  load().then(d => d ? render(d) : (document.getElementById("app").innerHTML = "<p>Resume data could not be loaded. Check that data/master.json is published with the site.</p>"));
})();
</script>
