<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joel Hibbard — Resume</title>
<meta name="description" content="Joel Hibbard: technology and operations leader for enterprise platforms, data architecture and human-centered systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F7F4;      /* cool clinical white */
    --ink:#1C2430;        /* slate ink */
    --muted:#5B6672;
    --scrub:#2F6F6A;      /* surgical teal */
    --brass:#9A7535;      /* insignia brass, used once */
    --rule:#D3D9D4;
    --serif:"Source Serif 4", Georgia, serif;
    --sans:"Instrument Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16.5px/1.6 var(--sans)}
  a{color:var(--scrub);text-underline-offset:3px}
  a:focus-visible,button:focus-visible{outline:2px solid var(--scrub);outline-offset:3px;border-radius:2px}
  .wrap{max-width:62rem;margin:0 auto;padding:4.5rem 1.5rem 3rem}
  /* hero */
  header.hero{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:end;padding-bottom:2.5rem;border-bottom:1px solid var(--rule)}
  h1{font:600 clamp(2.6rem,6vw,4.25rem)/1.02 var(--serif);letter-spacing:-.02em;margin:0 0 1rem}
  .headline{font:400 clamp(1.15rem,2.2vw,1.45rem)/1.4 var(--serif);max-width:34ch;margin:0;color:var(--ink)}
  .contact{list-style:none;margin:0;padding:0;text-align:right;font-size:.92rem;color:var(--muted);line-height:1.9}
  .variant{display:inline-block;margin-top:.75rem;font-size:.85rem;color:var(--scrub);border:1px solid var(--scrub);border-radius:999px;padding:.1rem .7rem}
  .actions{margin-top:.6rem}
  .actions button{font:500 .85rem var(--sans);background:none;border:0;color:var(--scrub);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
  section{padding:2.75rem 0;border-bottom:1px solid var(--rule)}
  h2{font:600 1.5rem/1.2 var(--serif);margin:0 0 1.5rem}
  .lede{font:400 1.1rem/1.7 var(--serif);max-width:66ch;margin:0}
  /* value props: plain columns */
  .props{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-top:2.25rem}
  .props h3{font:600 1rem/1.3 var(--sans);margin:0 0 .4rem;color:var(--scrub)}
  .props p{margin:0;font-size:.95rem;color:var(--ink)}
  /* the memorable piece: skill bridges */
  .bridges{display:grid;gap:0}
  .bridge{display:grid;grid-template-columns:11rem 1fr 13rem;align-items:center;gap:1.25rem;padding:1.1rem 0;border-top:1px solid var(--rule)}
  .bridge:first-child{border-top:0}
  .bridge .soft{font:600 1.05rem/1.25 var(--serif);text-align:right}
  .bridge .hard{font:600 .95rem/1.3 var(--sans);color:var(--scrub)}
  .span{position:relative;font-size:.9rem;color:var(--muted);padding:0 0 0 0}
  .span::before{content:"";display:block;height:2px;background:linear-gradient(90deg,var(--ink),var(--scrub));margin-bottom:.5rem;border-radius:2px}
  .bridge-key{display:grid;grid-template-columns:11rem 1fr 13rem;gap:1.25rem;font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
  .bridge-key span:first-child{text-align:right}
  /* competencies */
  .comp{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
  .comp h3{font:600 1rem var(--serif);margin:0 0 .6rem}
  .comp ul{margin:0;padding:0;list-style:none;font-size:.93rem}
  .comp li{padding:.28rem 0;border-bottom:1px dotted var(--rule)}
  /* experience: a real timeline, so a date rail */
  .job{display:grid;grid-template-columns:9rem 1fr;gap:1.75rem;padding:1.5rem 0}
  .job+.job{border-top:1px solid var(--rule)}
  .dates{font-size:.88rem;color:var(--muted);padding-top:.25rem;font-variant-numeric:tabular-nums}
  .job h3{font:600 1.2rem/1.3 var(--serif);margin:0}
  .job .co{font-weight:500;color:var(--scrub);margin:.15rem 0 .5rem}
  .job .ctx{font-size:.93rem;color:var(--muted);margin:0 0 .6rem;max-width:68ch}
  .job ul{margin:0;padding-left:1.1rem;max-width:72ch}
  .job li{margin:.35rem 0}
  .early{margin:1.25rem 0 0 10.75rem;font-size:.93rem;color:var(--muted);max-width:68ch}
  .early p{margin:.3rem 0}
  /* stack */
  dl.stack{display:grid;grid-template-columns:9rem 1fr;gap:.6rem 1.75rem;margin:0}
  dl.stack dt{font-weight:600;font-size:.93rem}
  dl.stack dd{margin:0;font-size:.93rem;color:var(--muted)}
  /* quiet footer: education lives here on purpose */
  footer{padding:2rem 0 0;font-size:.86rem;color:var(--muted);display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
  footer strong{display:block;color:var(--ink);font-weight:600;margin-bottom:.15rem}
  .veteran{color:var(--brass);font-weight:600}
  @media (max-width:760px){
    .wrap{padding-top:2.5rem}
    header.hero{grid-template-columns:1fr}
    .contact{text-align:left}
    .props,.comp,footer{grid-template-columns:1fr}
    .bridge,.bridge-key{grid-template-columns:1fr;gap:.35rem}
    .bridge .soft,.bridge-key span:first-child{text-align:left}
    .bridge-key{display:none}
    .job{grid-template-columns:1fr;gap:.25rem}
    .early{margin-left:0}
    dl.stack{grid-template-columns:1fr;gap:.15rem}
    dl.stack dd{margin-bottom:.6rem}
  }
  @media print{
    @page{margin:.55in}
    body{background:#fff;font-size:10.5pt}
    .wrap{padding:0;max-width:none;zoom:.9}
    .actions,.variant{display:none}
    section{padding:1rem 0}
    h1{font-size:28pt}
    .job{padding:.6rem 0}
    .job li,.job h3,.job .co{break-inside:avoid;break-after:auto}
    h2,.job h3,.job .co{break-after:avoid}
    .bridge{padding:.45rem 0}
    a{color:var(--ink);text-decoration:none}
    body{font-size:9pt;line-height:1.35}
    .wrap > section:first-of-type{padding-top:.5rem}
    section{padding:.55rem 0}
    header.hero{padding-bottom:.8rem}
    .headline{font-size:12pt}
    .lede{font-size:10pt;line-height:1.5}
    .props{margin-top:.8rem;gap:1rem}
    .props p{font-size:9pt}
    section[aria-labelledby="s-br"],section[aria-labelledby="s-comp"]{display:none}
    dl.stack{grid-template-columns:6.5rem 1fr;gap:.15rem 1rem}
    dl.stack dt,dl.stack dd{font-size:9pt}
    @page{margin:.4in .45in}
    .props{display:none}
    h2{font-size:13pt;margin-bottom:.5rem}
    .job{grid-template-columns:6.5rem 1fr;gap:1rem;padding:.4rem 0}
    .job li{margin:.15rem 0}
    .job .ctx{display:none}
    .early{margin-left:7.5rem}
    .comp li{padding:.05rem 0;border:0;font-size:8.8pt}
    footer{padding-top:.6rem}
  }
  @media (prefers-reduced-motion:no-preference){
    .span::before{transform-origin:left;animation:draw .9s ease-out both}
    .bridge:nth-child(2) .span::before{animation-delay:.12s}
    .bridge:nth-child(3) .span::before{animation-delay:.24s}
    .bridge:nth-child(4) .span::before{animation-delay:.36s}
    .bridge:nth-child(5) .span::before{animation-delay:.48s}
    @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  }
</style>
</head>

<script>
(function(){
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = ym => { if(!ym || ym==="Present") return ym||""; const [y,m]=ym.split("-"); return new Date(+y,(+m||1)-1).toLocaleString("en-US",{month:"short",year:"numeric"}); };

  // Variant selection: ?v=slug (GitHub Pages) or #v-slug (hash-only hosts)
  const q = new URLSearchParams(location.search).get("v");
  const h = (location.hash.match(/^#v-([a-z0-9-]+)$/)||[])[1];
  const slug = (q || h || "").replace(/[^a-z0-9-]/g,"");
  const url = slug ? `tailored/${slug}.json` : "data/master.json";

  function inline(){ try{ return JSON.parse(document.getElementById("inline-data").textContent); }catch(e){ return null; } }

  async function load(){
    try{ const r = await fetch(url,{cache:"no-store"}); if(r.ok) return r.json(); }catch(e){}
    return inline();
  }

  function render(d){
    const p = d.person, v = d.variant || {};
    const jobs = d.experience.map(j => `
      <article class="job">
        <div class="dates">${esc(fmt(j.start))} – ${esc(fmt(j.end))}</div>
        <div>
          <h3>${esc(j.title)}</h3>
          <p class="co">${esc(j.company)}${j.location ? `, ${esc(j.location)}`:""}</p>
          ${j.context ? `<p class="ctx">${esc(j.context)}</p>`:""}
          <ul>${j.bullets.map(b=>`<li>${esc(b.text)}</li>`).join("")}</ul>
        </div>
      </article>`).join("");
    const early = (d.earlier_career||[]).map(e=>`<p>${esc(e.text)}</p>`).join("");
    const bridges = (d.skill_bridges||[]).map(b=>`
      <div class="bridge">
        <div class="soft">${esc(b.soft)}</div>
        <div class="span">${esc(b.evidence)}</div>
        <div class="hard">${esc(b.hard)}</div>
      </div>`).join("");
    const comp = d.competencies||{};
    const compCol = (t,arr)=> arr&&arr.length ? `<div><h3>${t}</h3><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
    const stack = Object.entries(d.tech_stack||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v.map(esc).join(", ")}</dd>`).join("");
    const edu = (d.education||[]).map(e=>`${esc(e.degree)}, ${esc(e.school)}`).join("<br>");

    document.title = `${p.name} — ${v.target_role || "Resume"}`;
    document.getElementById("app").innerHTML = `
      <header class="hero">
        <div>
          <h1>${esc(p.name)}</h1>
          <p class="headline">${esc(p.headline)}</p>
          ${v.id && v.id!=="master" ? `<span class="variant">Tailored for ${esc(v.label)}</span>`:""}
        </div>
        <ul class="contact">
          <li>${esc(p.location)}</li>
          <li><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></li>
          <li><a href="${esc(p.linkedin)}">LinkedIn</a> &nbsp; <a href="${esc(p.github)}">GitHub</a></li>
          <li class="actions"><button type="button" id="print">Save as PDF</button></li>
        </ul>
      </header>

      <section aria-labelledby="s-sum">
        <h2 id="s-sum" class="sr">Summary</h2>
        <p class="lede">${esc(d.summary)}</p>
        <div class="props">${(d.value_props||[]).map(x=>`<div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join("")}</div>
      </section>

      ${bridges ? `<section aria-labelledby="s-br">
        <h2 id="s-br">Where the people skills meet the technical work</h2>
        <div class="bridge-key"><span>Leadership trait</span><span>Proof</span><span>Technical capability</span></div>
        <div class="bridges">${bridges}</div>
      </section>`:""}

      <section aria-labelledby="s-exp">
        <h2 id="s-exp">Experience</h2>
        ${jobs}
        ${early ? `<div class="early"><p><strong>Earlier career</strong></p>${early}</div>`:""}
      </section>

      <section aria-labelledby="s-comp">
        <h2 id="s-comp">Capabilities</h2>
        <div class="comp">
          ${compCol("Leadership", comp.leadership)}
          ${compCol("Technical", comp.technical)}
          ${compCol("Human-centered", comp.human)}
        </div>
      </section>

      <section aria-labelledby="s-stack">
        <h2 id="s-stack">Technology I work in</h2>
        <dl class="stack">${stack}</dl>
      </section>

      <footer>
        <div><strong>Service</strong><span class="veteran">U.S. Navy veteran</span>, FMF Corpsman</div>
        <div><strong>Certifications and languages</strong>${(d.certifications||[]).map(esc).join("<br>")}<br>${(d.languages||[]).map(esc).join(", ")}</div>
        <div><strong>Education</strong>${edu}</div>
      </footer>`;
    const pb = document.getElementById("print");
    if(pb) pb.addEventListener("click",()=>{ try{ window.print(); }catch(e){} });
  }

  load().then(d => d ? render(d) : (document.getElementById("app").innerHTML = "<p>Resume data could not be loaded. Check that data/master.json is published with the site.</p>"));
})();
